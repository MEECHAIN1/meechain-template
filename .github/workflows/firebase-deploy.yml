name: Firebase Deploy
on:
  push: yaml
    branches: production
      dispatch: npm install
      
permissions:
  contents: read
  pull-requests: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install dependencies
        run: |
          cd firebase-functions/functions
          npm ci

      - name: Build functions
        run: |
          cd firebase-functions/functions
          npm run build

      - name: Run tests
        run: |
          cd firebase-functions/functions
          npm test

      - name: Deploy to Firebase
        run: |
          cd firebase-functions
          # firebase deploy --only functions --token ${{ secrets.FIREBASE_TOKEN }}
          echo "Firebase deployment would happen here"
          echo "Set FIREBASE_TOKEN secret in repository settings"
          echo "Run: firebase login:ci to get token"
        # Uncomment when FIREBASE_TOKEN is configured
        # env:
        #   FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Comment deployment status
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            // Find associated PR if exists
            const commit = context.sha;
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: commit
            });
            
            if (prs.length > 0) {
              const pr = prs[0];
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body: `🔥 Firebase Functions deployed successfully!\n\nCommit: ${commit.substring(0, 7)}`
              });
            }

      - name: Deployment summary
        run: |
          echo "### 🔥 Firebase Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Functions built successfully" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Tests passed" >> $GITHUB_STEP_SUMMARY
          echo "- ✅ Deployment completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        working-directory: ./firebase-functions

      - name: Build functions
        working-directory: ./firebase-functions
        run: npm run build

      - name: Deploy to Firebase
        working-directory: ./firebase-functions
        run: firebase deploy --only functions --token ${{ secrets.FIREBASE_TOKEN }}
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}

      - name: Notify deployment
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const message = `
            ✅ **Firebase Functions Deployed Successfully**
            
            **Commit:** ${context.sha.substring(0, 7)}
            **Author:** @${context.actor}
            **Time:** ${new Date().toISOString()}
            
            All cloud functions are now live! 🚀
            `;
            
            // You could post this to Discord, Slack, etc.
            console.log(message);
