name: Welcome New Contributors

on:
  pull_request_target:
    types: [opened]
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  welcome:
    runs-on: ubuntu-latest
    
    steps:
      - name: Welcome new contributor (PR)
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const author = context.payload.pull_request.user.login;
            
            // Check if this is the first contribution
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: author,
              state: 'all'
            });
            
            if (prs.length === 1) {
              const message = `## 🎉 Welcome to MeeChain, @${author}!
            
            Thank you for opening your first Pull Request! We're excited to have you as a contributor! 💙
            
            ### 🚀 What's Next?
            
            - A maintainer will review your PR soon
            - Feel free to ask questions if you need help
            - Check out our [Contributing Guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md) for more info
            
            ### 🏅 Contributor Benefits
            
            When your PR is merged, you'll receive:
            - **First Contribution** badge 🌟
            - Points in our contributor system
            - Recognition from MeeBot!
            
            ### 📚 Resources
            
            - [Documentation](https://github.com/${context.repo.owner}/${context.repo.repo}/tree/main/docs)
            - [Academy](https://github.com/${context.repo.owner}/${context.repo.repo}/tree/main/academy)
            - [Code of Conduct](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CODE_OF_CONDUCT.md)
            
            ---
            
            **Welcome to the community! We're happy to have you here! 🌟**`;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
            }

      - name: Welcome new contributor (Issue)
        if: github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const author = context.payload.issue.user.login;
            
            // Check if this is the first issue
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: author,
              state: 'all'
            });
            
            if (issues.length === 1) {
              const message = `## 👋 Hello @${author}!
            
            Thank you for opening your first issue! We appreciate you taking the time to contribute! 💙
            
            ### 🔍 What Happens Next?
            
            - A maintainer will review your issue
            - We may ask for more information
            - If it's a bug, we'll work on fixing it
            - If it's a feature request, we'll discuss it with the community
            
            ### 💡 Want to Contribute?
            
            - Check our [Good First Issues](https://github.com/${context.repo.owner}/${context.repo.repo}/labels/good%20first%20issue)
            - Read the [Contributing Guide](https://github.com/${context.repo.owner}/${context.repo.repo}/blob/main/CONTRIBUTING.md)
            - Join our community discussions
            
            ---
            
            **Thank you for being part of MeeChain! 🌟**`;
            
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: message
            });
            }
