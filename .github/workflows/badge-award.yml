name: Badge Award System
name: Award Badge on PR Merge

on:
  pull_request:
    types: [closed]

permissions:
  contents: read
  pull-requests: write
  issues: write
  issues: write
  pull-requests: read

jobs:
  award-badge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Determine badge type
        id: badge
        run: |
          PR_TITLE="${{ github.event.pull_request.title }}"
          PR_LABELS="${{ join(github.event.pull_request.labels.*.name, ',') }}"
          PR_NUMBER="${{ github.event.pull_request.number }}"
          AUTHOR="${{ github.event.pull_request.user.login }}"
          
          # Determine badge based on PR characteristics
          BADGE_TYPE="contributor"
          
          if [[ "$PR_LABELS" == *"bug"* ]]; then
            BADGE_TYPE="bug-hunter"
          elif [[ "$PR_LABELS" == *"module"* ]]; then
            BADGE_TYPE="module-builder"
          elif [[ "$PR_LABELS" == *"documentation"* ]]; then
            BADGE_TYPE="documentation-hero"
          elif [[ "$PR_TITLE" == *"feat:"* ]] || [[ "$PR_TITLE" == *"feature"* ]]; then
            BADGE_TYPE="feature-creator"
          fi
          
          echo "badge_type=$BADGE_TYPE" >> $GITHUB_OUTPUT
          echo "author=$AUTHOR" >> $GITHUB_OUTPUT
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT

      - name: Check if first contribution
        id: first_contribution
        uses: actions/github-script@v7
        with:
          script: |
            const author = '${{ steps.badge.outputs.author }}';
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'closed',
              per_page: 100
            });
            
            const authorPRs = prs.filter(pr => pr.user.login === author && pr.merged_at);
            const isFirst = authorPRs.length === 1;
            
            core.setOutput('is_first', isFirst);
            return isFirst;

      - name: Comment on PR with badge
        uses: actions/github-script@v7
        with:
          script: |
            const badgeType = '${{ steps.badge.outputs.badge_type }}';
            const isFirst = '${{ steps.first_contribution.outputs.is_first }}' === 'true';
            
            const badges = {
              'bug-hunter': '🐛 **Bug Hunter**',
              'feature-creator': '✨ **Feature Creator**',
              'documentation-hero': '📚 **Documentation Hero**',
              'module-builder': '🧩 **Module Builder**',
              'contributor': '🌟 **Contributor**'
            };
            
            let message = `## 🎉 ขอแสดงความยินดี!\n\n`;
            
            if (isFirst) {
              message += `🌟 **First Contribution Badge** - นี่คือ PR แรกของคุณ!\n\n`;
            }
            
            message += `คุณได้รับ badge: ${badges[badgeType]}\n\n`;
            message += `ขอบคุณสำหรับการมีส่วนร่วมใน MeeChain Template! 🚀\n\n`;
            message += `Badge จะถูกบันทึกและแสดงในโปรไฟล์ของคุณในระบบ MeeChain`;
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: ${{ steps.badge.outputs.pr_number }},
              body: message
            });

      - name: Log badge award
        run: |
          echo "Badge awarded: ${{ steps.badge.outputs.badge_type }}"
          echo "Recipient: ${{ steps.badge.outputs.author }}"
          echo "PR: #${{ steps.badge.outputs.pr_number }}"
          echo "First contribution: ${{ steps.first_contribution.outputs.is_first }}"
          
          # In a real implementation, this would call Firebase Functions
          # to record the badge in the database
          # Example:
          # curl -X POST https://your-firebase-function.com/awardBadge \
          #   -H "Content-Type: application/json" \
          #   -d '{
          #     "user": "${{ steps.badge.outputs.author }}",
          #     "badge": "${{ steps.badge.outputs.badge_type }}",
          #     "pr": "${{ steps.badge.outputs.pr_number }}"
          #   }'
          # Ensure we have enough history for git diff
          if ! git rev-parse HEAD~1 >/dev/null 2>&1; then
            echo "HEAD~1 not available, fetching more history..."
            git fetch --unshallow || git fetch --depth=2
          fi
          
          # Check if this is first contribution
          AUTHOR="${{ github.event.pull_request.user.login }}"
          PR_COUNT=$(gh pr list --author "$AUTHOR" --state merged --json number --jq 'length')
          
          if [ "$PR_COUNT" -eq "1" ]; then
            echo "badge_type=first-contribution" >> "$GITHUB_OUTPUT"
            echo "badge_name=First Contribution" >> "$GITHUB_OUTPUT"
          else
            # Check what was changed
            if git diff --name-only HEAD~1 | grep -q "external-modules/"; then
              echo "badge_type=module-creator" >> "$GITHUB_OUTPUT"
              echo "badge_name=Module Creator" >> "$GITHUB_OUTPUT"
            elif git diff --name-only HEAD~1 | grep -q "academy/"; then
              echo "badge_type=educator" >> "$GITHUB_OUTPUT"
              echo "badge_name=Educator" >> "$GITHUB_OUTPUT"
            else
              echo "badge_type=contributor" >> "$GITHUB_OUTPUT"
              echo "badge_name=Contributor" >> "$GITHUB_OUTPUT"
            fi
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const badgeName = '${{ steps.badge.outputs.badge_name }}';
            const author = context.payload.pull_request.user.login;
            
            const comment = `
            🎉 **Congratulations @${author}!**
            
            Your contribution has been merged! 🚀
            
            **You've earned:**
            - 🏅 **${badgeName}** badge
            - 💰 MEE tokens (will be distributed soon)
            - ⭐ Recognition in our Contributors list
            
            Thank you for making MeeChain better! Keep contributing! 💪
            `;
            
            github.rest.issues.createComment({
              issue_number: context.payload.pull_request.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Add contributor to list
        run: |
          echo "TODO: Add contributor to CONTRIBUTORS.md"
          # This would typically call a script or API to update the contributors list
